name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:ingestion
      - run: npm audit --audit-level=high
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: spi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -d spi_test -v ON_ERROR_STOP=1 -f packages/database/migrations/001_initial.sql
        env:
          PGPASSWORD: ci-disposable-only
